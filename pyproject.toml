[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reimage"
version = "0.1.0"
description = "Rename the images in one folder with a shared prefix and a stable numeric sequence."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "HugoFernandoColmenares" }]
dependencies = [
  "textual==8.2.8",
  "platformdirs==4.13.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pyinstaller==6.22.3",
]

[project.scripts]
reimage = "reimage.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
